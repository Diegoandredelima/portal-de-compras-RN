<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página em Construção - Portal de Compras Governamentais</title>
    <!-- Importação do Tailwind CSS via CDN (padrão do projeto) -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Importação do Font Awesome para os ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <!-- Estilos específicos da página de construção -->
    <link rel="stylesheet" href="../css/construction.css">
</head>
<body>
    <!-- Link para Pular para o Conteúdo Principal (WCAG 2.1) -->
    <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>
    <main id="main-content" class="construction-container">
        <i class="fas fa-tools construction-icon" aria-hidden="true"></i> <!-- Ícone de ferramentas -->
        <h1 class="construction-title">Página em Construção</h1>
        <p class="construction-message">
            Estamos trabalhando para trazer um conteúdo incrível para você! Esta página está passando por uma manutenção e em breve estará disponível com muitas novidades. Agradecemos a sua paciência.
        </p>
        <div class="action-buttons">
            <a href="../index.html" class="action-button primary">
                <i class="fas fa-home" aria-hidden="true"></i> Voltar para a Página Inicial
            </a>
            <a href="mailto:contato@rn.gov.br" class="action-button secondary">
                <i class="fas fa-comment-dots" aria-hidden="true"></i> Enviar Feedback
            </a>
        </div>
    </main>
</body>
</html>
